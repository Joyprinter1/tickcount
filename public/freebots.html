<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<script src="/theme.js"></script>
<title>Free bots</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Instrument+Sans:wght@400..700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EDF0F3;--surface:#FFFFFF;--raise:#F2F5F8;--line:#D9DFE6;--fg:#101C26;--muted:#5B6977;
  --accent:#F0B03A;--on-accent:#1B1303;--win:#10915E;--loss:#D03A50;
  --shadow:0 1px 2px rgba(16,28,38,.06),0 8px 20px rgba(16,28,38,.05);
  --f-display:'Bricolage Grotesque',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --f-body:'Instrument Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0B1117;--surface:#131B23;--raise:#1A242E;--line:#26323E;--fg:#E7EDF2;--muted:#8997A6;--accent:#F2B544;--on-accent:#1A1303;--win:#37C98B;--loss:#F26A7E;--shadow:0 0 0 1px rgba(255,255,255,.02);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0B1117;--surface:#131B23;--raise:#1A242E;--line:#26323E;--fg:#E7EDF2;--muted:#8997A6;--accent:#F2B544;--on-accent:#1A1303;--win:#37C98B;--loss:#F26A7E;--shadow:0 0 0 1px rgba(255,255,255,.02);color-scheme:dark}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 var(--f-body);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{max-width:900px;margin:0 auto;padding:14px max(12px,env(safe-area-inset-right,0px)) 40px max(12px,env(safe-area-inset-left,0px))}
.hero{background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:16px 16px 14px}
.hero h1{margin:0;font:800 26px/1.1 var(--f-display);letter-spacing:-.02em}
.hero h1 b{color:var(--accent)}
.hero p{margin:6px 0 0;color:var(--muted)}
.chips{display:flex;gap:6px;overflow-x:auto;padding:12px 2px 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:13.5px;color:var(--muted);min-height:38px}
.chips button[aria-pressed=true]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.grid{display:grid;grid-template-columns:1fr;gap:14px;margin-top:12px}
@media (min-width:640px){.grid{grid-template-columns:repeat(2,1fr)}}
@media (min-width:960px){.grid{grid-template-columns:repeat(3,1fr)}}
.card{--a:#F2B544;background:linear-gradient(180deg,var(--surface),color-mix(in srgb,var(--a) 8%,var(--surface)));border:1.5px solid color-mix(in srgb,var(--a) 45%,var(--line));border-radius:20px;box-shadow:var(--shadow);padding:10px;display:flex;flex-direction:column;gap:10px}
.art{position:relative;aspect-ratio:16/10;display:grid;place-items:center;overflow:hidden;border-radius:14px}
.art img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.art svg.bg{position:absolute;inset:0;width:100%;height:100%}
.num{position:absolute;left:8px;top:8px;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font:800 15px var(--f-body);color:#fff;background:radial-gradient(circle at 30% 25%,#5b8cff,#1f3fb8);border:2px solid rgba(255,255,255,.9);box-shadow:0 2px 8px rgba(0,0,0,.35)}
.chip{position:absolute;left:30px;top:10px;padding:4px 10px 4px 20px;border-radius:999px;font:700 11px var(--f-body);letter-spacing:.06em;text-transform:uppercase;background:rgba(255,255,255,.88);color:#1f3fb8}
.prem{position:absolute;right:8px;top:8px;display:inline-flex;align-items:center;gap:4px;font:800 10px var(--f-body);letter-spacing:.08em;padding:4px 8px;border-radius:999px;background:#1B1303;color:#F2B544;border:1px solid rgba(242,181,68,.6)}
.body{padding:2px 4px 2px;display:flex;flex-direction:column;gap:4px;flex:1}
.acc{font:700 12px var(--f-body);letter-spacing:.12em;text-transform:uppercase;color:var(--a)}
.acc i{font-style:normal;color:var(--muted);font-weight:600}
.body b{font:800 20px/1.15 var(--f-display);letter-spacing:.01em;text-transform:uppercase}
.body small{color:var(--muted);font-size:13px;line-height:1.35}
.btn{margin-top:6px;min-height:48px;border-radius:12px;font-weight:700;font-size:16px;display:flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;width:100%}
.btn.on{background:linear-gradient(180deg,color-mix(in srgb,var(--a) 85%,#fff),var(--a));color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.35);border:1px solid color-mix(in srgb,var(--a) 70%,#000)}
.btn.off{background:var(--raise);color:var(--muted);border:1px solid var(--line);cursor:not-allowed}
.btn[disabled]{opacity:.7}
.state{margin:40px 8px;text-align:center;color:var(--muted)}
.retry{margin-top:12px;padding:10px 16px;border-radius:10px;background:var(--fg);color:var(--bg);font-weight:600}
.skel{height:300px;border-radius:16px;background:linear-gradient(90deg,var(--raise),var(--surface),var(--raise));background-size:200% 100%;animation:sk 1.3s linear infinite;border:1px solid var(--line)}
@keyframes sk{to{background-position:-200% 0}}
.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;max-width:90vw;z-index:9}
.note{margin:16px 4px 0;font-size:12.5px;color:var(--muted)}
</style>
</head>
<body>
<div class="app">
  <section class="hero">
    <h1>Free <b>bots</b></h1>
    <p>Pick a bot, load it into Deriv&rsquo;s bot builder, check the settings and tap Run.</p>
    <div class="chips" id="chips" role="group" aria-label="Bot type"></div>
  </section>
  <main id="grid" class="grid" aria-live="polite"></main>
  <div class="state" id="state" hidden></div>
  <p class="note">Premium bots are loaded only when the owner has unlocked them. Trading involves risk; no bot guarantees profit.</p>
</div>
<div class="toast" id="toast" hidden></div>
<script>
const EMBEDDED=window.parent!==window;
const $=s=>document.querySelector(s);
let bots=[],cats=[],cat='All';
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function shade(hex,k){const n=parseInt(hex.slice(1),16);let r=n>>16,g=(n>>8)&255,b=n&255;const f=k<0?0:255,t=Math.abs(k);r=Math.round((f-r)*t+r);g=Math.round((f-g)*t+g);b=Math.round((f-b)*t+b);return'#'+[r,g,b].map(x=>x.toString(16).padStart(2,'0')).join('');}
function art(b,i){
  const a=/^#[0-9a-f]{6}$/i.test(b.accent)?b.accent:'#F2B544',d=shade(a,-.55),l=shade(a,.55);
  const k='r'+i,hi=shade(a,.78),mid=shade(a,.45),dk=shade(a,-.6);
  const robot='<svg viewBox="0 0 320 200" preserveAspectRatio="xMidYMid slice" class="bg" aria-hidden="true">'+
   '<defs><linearGradient id="s'+k+'" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="'+shade(a,-.15)+'"/><stop offset="1" stop-color="'+dk+'"/></linearGradient>'+
   '<linearGradient id="m'+k+'" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff"/><stop offset=".55" stop-color="'+hi+'"/><stop offset="1" stop-color="'+mid+'"/></linearGradient>'+
   '<radialGradient id="o'+k+'" cx=".4" cy=".35" r=".7"><stop offset="0" stop-color="#fff"/><stop offset=".35" stop-color="'+hi+'"/><stop offset="1" stop-color="'+a+'" stop-opacity=".25"/></radialGradient>'+
   '<radialGradient id="g'+k+'"><stop offset="0" stop-color="'+hi+'" stop-opacity=".9"/><stop offset="1" stop-color="'+hi+'" stop-opacity="0"/></radialGradient></defs>'+
   '<rect width="320" height="200" fill="url(#s'+k+')"/>'+
   '<path d="M0 150 L50 100 L85 128 L130 80 L180 130 L225 95 L275 135 L320 110 V200 H0Z" fill="#fff" fill-opacity=".1"/>'+
   '<path d="M0 170 L60 130 L110 155 L160 118 L215 160 L270 125 L320 150 V200 H0Z" fill="#fff" fill-opacity=".08"/>'+
   '<g transform="translate(14 40)"><rect width="104" height="78" rx="8" fill="'+hi+'" fill-opacity=".14" stroke="'+hi+'" stroke-opacity=".7"/>'+
   '<g stroke="'+hi+'" stroke-opacity=".25"><path d="M0 20H104M0 40H104M0 60H104M26 0V78M52 0V78M78 0V78"/></g>'+
   '<g stroke="'+hi+'" stroke-width="2" stroke-linecap="round"><path d="M14 56V44M30 52V36M46 46V28M62 40V22M78 32V14M94 26V10" stroke-opacity=".9"/></g>'+
   '<path d="M8 60 L26 48 L44 52 L62 34 L80 28 L98 12" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></g>'+
   '<ellipse cx="236" cy="190" rx="82" ry="10" fill="#000" fill-opacity=".25"/>'+
   '<circle cx="262" cy="92" r="34" fill="url(#g'+k+')"/><circle cx="262" cy="92" r="19" fill="url(#o'+k+')"/>'+
   '<path d="M218 150 Q232 118 252 112 L262 112" fill="none" stroke="url(#m'+k+')" stroke-width="12" stroke-linecap="round"/><circle cx="256" cy="112" r="8" fill="'+mid+'"/>'+
   '<path d="M164 200 V168 Q164 146 190 142 H226 Q252 146 252 168 V200Z" fill="url(#m'+k+')"/>'+
   '<path d="M190 150 H226 L218 176 H198Z" fill="'+dk+'" fill-opacity=".55"/><circle cx="208" cy="162" r="5" fill="'+a+'"/><circle cx="208" cy="162" r="9" fill="'+hi+'" fill-opacity=".35"/>'+
   '<rect x="198" y="128" width="20" height="18" rx="5" fill="'+mid+'"/>'+
   '<rect x="182" y="82" width="52" height="50" rx="20" fill="url(#m'+k+')"/>'+
   '<rect x="188" y="94" width="40" height="22" rx="11" fill="'+dk+'"/>'+
   '<ellipse cx="199" cy="105" rx="5.5" ry="4.5" fill="'+hi+'"/><ellipse cx="217" cy="105" rx="5.5" ry="4.5" fill="'+hi+'"/><ellipse cx="199" cy="105" rx="9" ry="8" fill="'+hi+'" fill-opacity=".25"/><ellipse cx="217" cy="105" rx="9" ry="8" fill="'+hi+'" fill-opacity=".25"/>'+
   '<path d="M176 100 q-8 0 -8 12 q0 12 8 12 M240 100 q8 0 8 12 q0 12 -8 12" fill="none" stroke="'+mid+'" stroke-width="7" stroke-linecap="round"/>'+
   '<path d="M208 82 V70" stroke="'+hi+'" stroke-width="3" stroke-linecap="round"/><circle cx="208" cy="67" r="4.5" fill="'+a+'"/>'+
   '<circle cx="262" cy="92" r="19" fill="none" stroke="#fff" stroke-opacity=".4"/></svg>';
  const pic=b.image?'<img src="'+esc(b.image)+'" alt="" loading="lazy" decoding="async">':robot;
  return '<div class="art">'+pic+
   '<span class="num">'+(i+1)+'</span><span class="chip">Free bots</span>'+(b.downloadable?'':'<span class="prem">&#9733; PREMIUM</span>')+'</div>';
}
function render(){
  const list=bots.filter(b=>cat==='All'||b.category===cat);
  $('#chips').innerHTML=['All'].concat(cats.filter(c=>bots.some(b=>b.category===c))).map(c=>'<button type="button" data-c="'+esc(c)+'" aria-pressed="'+(c===cat)+'">'+esc(c)+'</button>').join('');
  const g=$('#grid');g.hidden=!list.length;
  g.innerHTML=list.map((b,i)=>'<article class="card" style="--a:'+(/^#[0-9a-f]{6}$/i.test(b.accent)?b.accent:'#F2B544')+'">'+art(b,i)+'<div class="body"><span class="acc">'+(b.downloadable?'Open access':'Premium')+' <i>&middot; '+esc(b.category)+'</i></span><b>'+esc(b.name)+'</b>'+(b.description?'<small>'+esc(b.description)+'</small>':'')+
    (b.downloadable?'<button type="button" class="btn on" data-load="'+b.id+'"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12m0 0l-5-5m5 5l5-5M5 21h14"/></svg>'+(EMBEDDED?'Load bot':'Download bot')+'</button>':'<button type="button" class="btn off" disabled>&#128274; Premium &middot; locked</button>')+'</div></article>').join('');
  const st=$('#state');
  st.hidden=!!list.length;
  if(!list.length)st.innerHTML=bots.length?'No bots in this type yet.':'No bots yet. New bots will appear here soon.';
}
function toast(t){const e=$('#toast');e.textContent=t;e.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>e.hidden=true,2800);}
async function load(){
  $('#grid').innerHTML=Array.from({length:6},()=>'<div class="skel"></div>').join('');
  try{
    const r=await fetch('/api/bots',{cache:'no-store'});if(!r.ok)throw 0;
    const j=await r.json();bots=j.bots||[];cats=j.categories||[];render();
  }catch(e){
    $('#grid').innerHTML='';const st=$('#state');st.hidden=false;
    st.innerHTML='Could not load the bots right now.<br><button type="button" class="retry" id="retry">Try again</button>';
  }
}
document.addEventListener('click',async e=>{
  const c=e.target.closest('[data-c]');if(c){cat=c.dataset.c;render();return;}
  if(e.target.id==='retry'){load();return;}
  const b=e.target.closest('[data-load]');if(!b)return;
  const bot=bots.find(x=>x.id===b.dataset.load);if(!bot)return;
  b.disabled=true;
  try{
    const r=await fetch('/api/bots/'+encodeURIComponent(bot.id)+'/xml',{cache:'no-store'});
    if(r.status===403){toast('This premium bot is locked right now.');load();return;}
    if(!r.ok)throw 0;
    const xml=await r.text();
    if(EMBEDDED){window.parent.postMessage({type:'tickdesk:loadbot',name:bot.name,xml:xml},window.location.origin);toast('Opening Deriv bot builder…');}
    else{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([xml],{type:'application/xml'}));a.download=bot.name.replace(/[^\w.-]+/g,'_')+'.xml';a.click();}
  }catch(err){toast('Could not get that bot. Try again.');}
  finally{b.disabled=false;}
});
load();
</script>
</body>
</html>
